<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processando...</title>
  <script>
    // Processar callback silenciosamente sem mostrar interface
    async function processarCallback() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const usuarioId = params.get('usuarioId') || 'usuario-padrao';

        if (!code) throw new Error('Código não recebido');

        // Enviar código para backend
        const response = await fetch(`/api/auth/google/callback?code=${encodeURIComponent(code)}&usuarioId=${encodeURIComponent(usuarioId)}`);
        const data = await response.json();

        if (data.success && data.tokens) {
          // Salvar token
          sessionStorage.setItem('gmnAccessToken', data.tokens.access_token);
          sessionStorage.setItem('gmnUsuarioId', usuarioId);

          // Redirecionar de volta para dashboard
          window.location.href = '/?tab=gmn-metricas&connected=true';
        } else {
          throw new Error(data.error || 'Erro ao conectar');
        }
      } catch (error) {
        console.error('OAuth Error:', error);
        // Voltar para home em caso de erro
        setTimeout(() => window.location.href = '/', 2000);
      }
    }

    // Processar assim que a página carregar
    window.addEventListener('load', processarCallback);
  </script>
  <style>
    body { background: #0f0d22; margin: 0; }
  </style>
</head>
<body>
</body>
</html>
