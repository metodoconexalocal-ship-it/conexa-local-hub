<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processando...</title>
  <script>
    async function processarCallback() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        // Recuperar usuarioId do sessionStorage (foi salvo antes de redirecionar para Google)
        let usuarioId = sessionStorage.getItem('gmnUsuarioId');
        if (!usuarioId) usuarioId = 'usuario-padrao';

        console.log('[OAuth] Processando callback para usuarioId:', usuarioId);

        if (!code) throw new Error('Código não recebido');

        // Enviar código para backend COM usuarioId
        const response = await fetch(`/api/auth/google/callback?code=${encodeURIComponent(code)}&usuarioId=${encodeURIComponent(usuarioId)}`);
        const data = await response.json();

        if (data.success && data.tokens) {
          console.log('[OAuth] Token recebido, salvando...');

          // Salvar tokens em localStorage (persiste entre abas/recarregos)
          localStorage.setItem('gmnAccessToken', data.tokens.access_token);
          localStorage.setItem('gmnRefreshToken', data.tokens.refresh_token || '');
          localStorage.setItem('gmnTokenExpiry', data.tokens.expiry_date || '');
          localStorage.setItem('gmnOAuthConnected', 'true');
          localStorage.setItem('gmnOAuthReturning', 'true');
          localStorage.setItem('gmnPreserveSession', 'true');

          console.log('[OAuth] Tokens salvos em localStorage, redirecionando...');
          console.log('localStorage.gmnAccessToken:', localStorage.getItem('gmnAccessToken')?.substring(0, 20) + '...');

          // Redirecionar para dashboard
          window.location.href = '/?tab=gmn-metricas&oauth=success';
        } else {
          throw new Error(data.error || 'Erro ao conectar');
        }
      } catch (error) {
        console.error('[OAuth] Erro:', error);
        sessionStorage.setItem('gmnOAuthError', error.message);

        // Voltar para home em caso de erro
        setTimeout(() => window.location.href = '/?oauth=error', 2000);
      }
    }

    // Processar assim que a página carregar
    if (document.readyState === 'loading') {
      window.addEventListener('load', processarCallback);
    } else {
      processarCallback();
    }
  </script>
  <style>
    body { background: #0f0d22; margin: 0; }
  </style>
</head>
<body>
</body>
</html>
