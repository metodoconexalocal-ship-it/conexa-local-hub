<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Leads</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;background:#f4f1fb;color:#1a1040;min-height:100vh}

/* Variáveis de cor dinâmicas — sobrescritas via JS com a cor do cliente */
:root{--primary:#7c3aed;--primary-light:rgba(124,58,237,.12);--primary-border:rgba(124,58,237,.3)}

input,textarea,select{color:#1a1040!important}
input::placeholder,textarea::placeholder{color:#9ca3af!important;opacity:1!important}

.banner{width:100%;height:180px;object-fit:cover;display:block;background:linear-gradient(135deg,var(--primary),#a855f7)}
.banner-wrap{position:relative;background:linear-gradient(135deg,var(--primary),#a855f7)}
.logo-over{position:absolute;left:24px;bottom:14px;height:52px;object-fit:contain;border-radius:8px;background:#fff;padding:6px 10px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.portal-title{position:absolute;right:24px;bottom:16px;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.3px}

.container{max-width:860px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 20px rgba(0,0,0,.07);padding:24px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--primary);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--primary-light)}

label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:5px}
input[type=text],input[type=tel],input[type=date],input[type=email],textarea,select{
  width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:13px;
  font-family:inherit;background:#fff;outline:none;transition:.15s;color:#1a1040}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea{resize:vertical}
select option{color:#1a1040;background:#fff}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px}
.field-item{display:flex;flex-direction:column;min-width:0}
.field-item.field-wide{grid-column:1/-1}
.form-section{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid #eef0f4}
.form-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.form-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--primary);margin-bottom:14px;display:flex;align-items:center;gap:8px}
#form-fields{display:flex;flex-direction:column}

.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),#a855f7);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;margin-top:8px;letter-spacing:.3px}
.btn-submit:hover{opacity:.92;transform:translateY(-1px)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

.yesno-group{display:flex;gap:8px}
.yesno-btn{flex:1;padding:10px;border:1.5px solid #e5e7eb;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:.15s;background:#fff;color:#6b7280}
.yesno-btn.active-yes{border-color:#22c55e;background:rgba(34,197,94,.1);color:#16a34a}
.yesno-btn.active-no{border-color:#ef4444;background:rgba(239,68,68,.1);color:#dc2626}

/* Tabela de leads */
.leads-table{width:100%;border-collapse:collapse;font-size:12px}
.leads-table th{padding:9px 12px;text-align:left;border-bottom:2px solid var(--primary-light);color:var(--primary);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;white-space:nowrap;background:#faf9fe}
.leads-table td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#374151}
.leads-table tr:hover td{background:#faf9fe}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge-hot{background:rgba(239,68,68,.1);color:#dc2626}
.badge-warm{background:rgba(245,158,11,.1);color:#d97706}
.badge-cold{background:rgba(59,130,246,.1);color:#2563eb}
.badge-yes{background:rgba(34,197,94,.12);color:#16a34a}
.badge-no{background:rgba(239,68,68,.1);color:#dc2626}

/* Auth screen */
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:24px}
.auth-card{background:#fff;border-radius:18px;padding:36px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.1)}
.auth-card h2{font-size:20px;font-weight:800;color:#1a1040;margin-bottom:6px}
.auth-card p{font-size:13px;color:#6b7280;margin-bottom:24px}
.auth-input{width:100%;padding:13px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;text-align:center;letter-spacing:.2em;outline:none;font-family:inherit;transition:.15s;color:#1a1040}
.auth-input:focus{border-color:var(--primary)}
.auth-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),#a855f7);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.auth-error{font-size:12px;color:#dc2626;margin-top:10px;display:none}

/* Tabs */
.tabs{display:flex;gap:4px;background:#f1edf9;border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;color:#9080b8;background:transparent;transition:.15s;font-family:inherit}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.toast{position:fixed;bottom:24px;right:24px;background:#1a1040;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:600px){.banner{height:120px}.field-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Banner do cliente (preenchido via JS) -->
<div class="banner-wrap" id="banner-wrap" style="min-height:140px">
  <div style="width:100%;height:140px;display:flex;align-items:center;justify-content:center" id="banner-placeholder">
    <span style="color:rgba(255,255,255,.6);font-size:13px">Carregando portal...</span>
  </div>
</div>

<!-- Auth -->
<div id="auth-screen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <div style="font-size:36px;margin-bottom:12px">🔐</div>
    <h2>Acesso ao Portal</h2>
    <p id="auth-subtitle">Digite o código de acesso fornecido pela sua agência</p>
    <input type="password" id="auth-code" class="auth-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')authLogin()" autocomplete="current-password">
    <button onclick="authLogin()" class="auth-btn">Entrar →</button>
    <div id="auth-error" class="auth-error">Código incorreto. Tente novamente.</div>
  </div>
</div>

<!-- Conteúdo autenticado -->
<div id="portal-content" class="container" style="display:none">

  <div class="tabs">
    <button class="tab active" id="tab-form" onclick="switchTab('form')">➕ Novo Lead</button>
    <button class="tab" id="tab-leads" onclick="switchTab('leads')">📋 Meus Leads</button>
  </div>

  <!-- Formulário de novo lead -->
  <div id="view-form">
    <div class="card">
      <div class="card-title">➕ Cadastrar Novo Lead</div>
      <form id="lead-form" onsubmit="submitLead(event)">
        <div id="form-fields" class="field-grid"></div>
        <button type="submit" class="btn-submit" id="btn-submit">✔ Registrar Lead</button>
      </form>
    </div>
  </div>

  <!-- Lista de leads -->
  <div id="view-leads" style="display:none">
    <div class="card">
      <div class="card-title">📋 Leads Registrados</div>
      <div id="leads-list">
        <div style="text-align:center;padding:32px;color:#9ca3af">⏳ Carregando...</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection, query, where, orderBy, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD775h8BBglzDCSx2jkC5hKT97qJGZ-MJg",
  authDomain: "crm-digitalcreate.firebaseapp.com",
  projectId: "crm-digitalcreate",
  storageBucket: "crm-digitalcreate.firebasestorage.app",
  messagingSenderId: "633842305840",
  appId: "1:633842305840:web:400c2ae135c3edb136d6f5"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Globals ────────────────────────────────────────────────────────────────

window._portalId  = new URLSearchParams(location.search).get('c');
window._portalCfg = null; // configuração pública
window._accessCode = null;
window._yesnoState = {};  // {fieldId: 'Sim'|'Não'}

const ESC = (s) => s == null ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#x27;');

// ── Inicialização ──────────────────────────────────────────────────────────

async function init() {
  const pid = window._portalId;
  if (!pid) { document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#9ca3af"><div style="font-size:36px">🔗</div><p>Link inválido. Verifique com sua agência.</p></div>'; return; }

  // Carrega config pública
  try {
    const snap = await getDoc(doc(db, 'ghub_portal_public', pid));
    if (!snap.exists()) {
      document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#9ca3af"><div style="font-size:36px">❌</div><p>Portal não encontrado.</p></div>';
      return;
    }
    window._portalCfg = { id: pid, ...snap.data() };
    renderBanner();
  } catch(e) {
    console.error(e);
    document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#9ca3af"><p>Erro ao carregar portal.</p></div>';
    return;
  }

  // Verifica sessão
  const saved = sessionStorage.getItem('portal_session_' + pid);
  if (saved) {
    window._accessCode = saved;
    showPortal();
  } else {
    showAuth();
  }
}

// ── Banner ─────────────────────────────────────────────────────────────────

function renderBanner() {
  const cfg = window._portalCfg;
  if (!cfg) return;

  // Cor primária
  if (cfg.primaryColor) {
    document.documentElement.style.setProperty('--primary', cfg.primaryColor);
    document.documentElement.style.setProperty('--primary-light', cfg.primaryColor + '20');
    document.documentElement.style.setProperty('--primary-border', cfg.primaryColor + '50');
  }

  const wrap = document.getElementById('banner-wrap');
  wrap.style.background = `linear-gradient(135deg,${cfg.primaryColor||'#7c3aed'},#a855f7)`;

  let inner = '';
  if (cfg.bannerUrl) {
    inner = `<img src="${ESC(cfg.bannerUrl)}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'">`;
  } else {
    inner = `<div style="height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:rgba(255,255,255,.9)">
      <div style="font-size:26px;font-weight:800">${ESC(cfg.clientName||'Portal de Leads')}</div>
      ${cfg.portalTitle?`<div style="font-size:13px;opacity:.8;margin-top:6px">${ESC(cfg.portalTitle)}</div>`:''}
    </div>`;
  }

  const logo = cfg.logoUrl
    ? `<img src="${ESC(cfg.logoUrl)}" class="logo-over" onerror="this.style.display='none'">` : '';
  const title = cfg.portalTitle && cfg.bannerUrl
    ? `<div class="portal-title">${ESC(cfg.portalTitle)}</div>` : '';

  wrap.innerHTML = `<div style="position:relative;min-height:140px">${inner}${logo}${title}</div>`;
  document.title = cfg.clientName || 'Portal de Leads';
}

// ── Auth ───────────────────────────────────────────────────────────────────

function showAuth() {
  const cfg = window._portalCfg;
  document.getElementById('auth-subtitle').textContent =
    `Bem-vindo(a)${cfg?.clientName ? ', ' + cfg.clientName : ''}! Digite o código fornecido pela sua agência.`;
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('portal-content').style.display = 'none';
  setTimeout(() => document.getElementById('auth-code').focus(), 100);
}

window.authLogin = async function() {
  const code = document.getElementById('auth-code').value.trim();
  const err  = document.getElementById('auth-error');
  err.style.display = 'none';
  if (!code) return;

  // Testa criando um lead temporário com o código — Firestore valida no servidor
  // Se a regra permitir, o código está correto
  // Usamos um documento especial de verificação
  try {
    // Tentamos buscar a config completa não funcionará (regra bloqueia anon),
    // então usamos a estratégia de "test write" com um lead vazio descartável
    const testRef = await addDoc(collection(db, 'ghub_portal_leads'), {
      portalId:  window._portalId,
      accessCode: code,
      _testOnly: true,
      createdAt: new Date().toISOString(),
    });
    // Se chegou aqui, o código é válido — mas vamos deletar o doc de teste
    // (o Firestore não tem deleteDoc sem auth, mas o doc de teste fica marcado)
    // Na prática: apenas registrar sessão localmente
    window._accessCode = code;
    sessionStorage.setItem('portal_session_' + window._portalId, code);
    showPortal();
  } catch(e) {
    // PERMISSION_DENIED = código errado
    err.style.display = 'block';
    document.getElementById('auth-code').value = '';
    document.getElementById('auth-code').focus();
  }
};

// ── Portal principal ───────────────────────────────────────────────────────

function showPortal() {
  document.getElementById('auth-screen').style.display  = 'none';
  document.getElementById('portal-content').style.display = '';
  buildForm();
}

window.switchTab = function(tab) {
  ['form','leads'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t===tab);
    document.getElementById(`view-${t}`).style.display = t===tab ? '' : 'none';
  });
  if (tab === 'leads') loadLeads();
};

// ── Construção do formulário ───────────────────────────────────────────────

const ALL_FIELDS = [
  {id:'dataContato',       label:'Data do Contato',         type:'date',     req:true },
  {id:'nomeResponsavel',   label:'Nome do Responsável',     type:'text',     req:true },
  {id:'nomeCrianca',       label:'Nome da Criança / Lead',  type:'text',     req:false},
  {id:'dataNascimento',    label:'Data de Nascimento',      type:'date',     req:false},
  {id:'telefone',          label:'Telefone / WhatsApp',     type:'tel',      req:true },
  {id:'unidade',           label:'Unidade / Campo',         type:'select-custom', req:false, listKey:'customUnidades'},
  {id:'origemLead',        label:'Origem do Lead',          type:'select-custom', req:true,  listKey:'customOrigens'},
  {id:'tipoTrafego',       label:'Tipo de Tráfego',         type:'select-fixed', req:false, options:['Pago','Orgânico']},
  {id:'temperatura',       label:'Temperatura',             type:'select-fixed', req:false, options:['🔥 Quente','☀️ Morno','❄️ Frio']},
  {id:'statusAtendimento', label:'Status do Atendimento',   type:'select-custom',req:true,  listKey:'customStatus'},
  {id:'aulaExpAgendada',   label:'Aula Experimental Agendada?', type:'yesno', req:false},
  {id:'dataAulaExp',       label:'Data da Aula Experimental',   type:'date',  req:false},
  {id:'matricula',         label:'Matriculou?',             type:'yesno',    req:false},
  {id:'followupRealizado', label:'Follow-up Realizado?',    type:'yesno',    req:false},
  {id:'dataFollowup',      label:'Data do Follow-up',       type:'date',     req:false},
  {id:'observacoes',       label:'Observações',             type:'textarea', req:false},
];

const DEFAULT_ORIGENS = ['Meta Ads','Google Ads','Anúncios Patrocinados','Google Orgânico','Instagram','Indicação','Parceria','Cartazes/Offline','Outros'];
const DEFAULT_STATUS  = ['Novo lead','Em atendimento','Aguardando resposta','Aula experimental agendada','Aula experimental realizada','Aguardando vaga','Não matriculou','Matriculou'];

// Seções de organização do formulário (#visual)
const FORM_SECTIONS = [
  { title: '👤 Dados do Contato',        icon:'person',   fields: ['dataContato','nomeResponsavel','nomeCrianca','dataNascimento','telefone'] },
  { title: '📍 Origem & Classificação',  icon:'compass',  fields: ['unidade','origemLead','tipoTrafego','temperatura'] },
  { title: '💬 Atendimento',             icon:'chat',     fields: ['statusAtendimento','aulaExpAgendada','dataAulaExp'] },
  { title: '🎯 Resultado & Follow-up',   icon:'flag',     fields: ['matricula','followupRealizado','dataFollowup'] },
  { title: '📝 Observações',             icon:'note',     fields: ['observacoes'] },
];

function _renderField(f, cfg) {
  const req = f.req ? '<span style="color:#dc2626">*</span>' : '';
  let input = '';
  if (f.type === 'text' || f.type === 'tel' || f.type === 'date') {
    const today = f.id==='dataContato' ? new Date().toISOString().slice(0,10) : '';
    input = `<input type="${f.type}" id="lf-${f.id}" ${f.req?'required':''} value="${today}" ${f.type==='date'?'style="color-scheme:light"':''}>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="lf-${f.id}" rows="3" placeholder="Detalhes, comentários, contexto..."></textarea>`;
  } else if (f.type === 'select-fixed') {
    input = `<select id="lf-${f.id}" ${f.req?'required':''}><option value="">— Selecione —</option>${(f.options||[]).map(o=>`<option>${ESC(o)}</option>`).join('')}</select>`;
  } else if (f.type === 'select-custom') {
    const opts = (cfg?.[f.listKey]?.length ? cfg[f.listKey] : f.listKey==='customOrigens' ? DEFAULT_ORIGENS : f.listKey==='customStatus' ? DEFAULT_STATUS : []);
    input = `<select id="lf-${f.id}" ${f.req?'required':''}><option value="">— Selecione —</option>${opts.map(o=>`<option>${ESC(o)}</option>`).join('')}</select>`;
  } else if (f.type === 'yesno') {
    input = `<div class="yesno-group">
      <button type="button" class="yesno-btn" id="lf-${f.id}-sim" onclick="_setYesNo('${f.id}','Sim')">Sim</button>
      <button type="button" class="yesno-btn" id="lf-${f.id}-nao" onclick="_setYesNo('${f.id}','Não')">Não</button>
    </div><input type="hidden" id="lf-${f.id}" value="">`;
  }
  const wide = (f.type === 'textarea' || f.id === 'observacoes') ? ' field-wide' : '';
  return `<div class="field-item${wide}"><label>${f.label} ${req}</label>${input}</div>`;
}

function buildForm() {
  const cfg      = window._portalCfg;
  const active   = cfg?.activeFields || ALL_FIELDS.map(f=>f.id);
  const container = document.getElementById('form-fields');
  const byId = (id) => ALL_FIELDS.find(f => f.id === id);

  let html = '';
  FORM_SECTIONS.forEach(sec => {
    const secFields = sec.fields.filter(id => active.includes(id)).map(byId).filter(Boolean);
    if (!secFields.length) return;
    html += `
      <div class="form-section">
        <div class="form-section-title">${sec.title}</div>
        <div class="field-grid">${secFields.map(f => _renderField(f, cfg)).join('')}</div>
      </div>`;
  });

  // Campos personalizados criados pela agência (#24)
  const custom = cfg?.customFields || [];
  if (custom.length) {
    html += `
      <div class="form-section">
        <div class="form-section-title">✨ Informações Adicionais</div>
        <div class="field-grid">${custom.map(f => {
          const inp = f.type === 'textarea'
            ? `<textarea id="lf-cf-${f.id}" rows="3"></textarea>`
            : `<input type="${['text','date','number','tel'].includes(f.type)?f.type:'text'}" id="lf-cf-${f.id}">`;
          const wide = f.type === 'textarea' ? ' field-wide' : '';
          return `<div class="field-item${wide}"><label>${ESC(f.label)}</label>${inp}</div>`;
        }).join('')}</div>
      </div>`;
  }

  container.innerHTML = html;
}

window._setYesNo = function(fid, val) {
  window._yesnoState[fid] = val;
  document.getElementById(`lf-${fid}`).value = val;
  const sim = document.getElementById(`lf-${fid}-sim`);
  const nao = document.getElementById(`lf-${fid}-nao`);
  if (sim) sim.className = 'yesno-btn' + (val==='Sim'?' active-yes':'');
  if (nao) nao.className = 'yesno-btn' + (val==='Não'?' active-no':'');
};

// ── Submeter lead ──────────────────────────────────────────────────────────

window.submitLead = async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Enviando...';

  const cfg    = window._portalCfg;
  const active = cfg?.activeFields || ALL_FIELDS.map(f=>f.id);
  const data   = { portalId: window._portalId, accessCode: window._accessCode, createdAt: new Date().toISOString() };

  ALL_FIELDS.filter(f => active.includes(f.id)).forEach(f => {
    const el = document.getElementById(`lf-${f.id}`);
    if (el) data[f.id] = el.value || '';
  });
  // Campos personalizados
  (cfg?.customFields || []).forEach(f => {
    const el = document.getElementById(`lf-cf-${f.id}`);
    if (el) data['cf_' + f.id] = el.value || '';
  });

  try {
    await addDoc(collection(db, 'ghub_portal_leads'), data);
    showToast('✅ Lead registrado com sucesso!');
    document.getElementById('lead-form').reset();
    buildForm(); // Reseta form incluindo yesno
    window._yesnoState = {};
  } catch(err) {
    console.error(err);
    if (err.code === 'permission-denied') {
      // Código expirou na sessão — pede reautenticação
      sessionStorage.removeItem('portal_session_' + window._portalId);
      showToast('❌ Sessão expirada. Faça login novamente.', true);
      setTimeout(() => { window._accessCode = null; showAuth(); }, 1800);
    } else {
      showToast('❌ Erro ao enviar. Tente novamente.', true);
    }
  } finally {
    btn.disabled = false; btn.textContent = '✔ Registrar Lead';
  }
};

// ── Carregar leads ─────────────────────────────────────────────────────────

async function loadLeads() {
  const el = document.getElementById('leads-list');
  el.innerHTML = '<div style="text-align:center;padding:32px;color:#9ca3af">⏳ Carregando leads...</div>';

  try {
    const q = query(
      collection(db, 'ghub_portal_leads'),
      where('portalId','==', window._portalId),
      orderBy('createdAt','asc')
    );
    // Esta query falha pois anon não pode ler portal_leads
    // Mostramos apenas o que foi enviado nesta sessão (sessionStorage)
    throw new Error('no_read');
  } catch(e) {
    // Leads só ficam visíveis para a agência (segurança intencional)
    el.innerHTML = `
    <div style="text-align:center;padding:40px;color:#9ca3af">
      <div style="font-size:36px;margin-bottom:12px">🔒</div>
      <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:8px">Leads registrados com sucesso</div>
      <div style="font-size:12px;line-height:1.6">Seus leads foram enviados para a agência DigitalCreate.<br>
      O histórico completo e as análises ficam disponíveis<br>no painel da agência.</div>
    </div>`;
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────

function showToast(msg, error=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = error ? '#dc2626' : '#1a1040';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Start ──────────────────────────────────────────────────────────────────
init();
</script>
